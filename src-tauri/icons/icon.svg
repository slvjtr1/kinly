<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Kinly mark: a rounded play shape in a coral-to-amber gradient with a small "head" beside it
       (people watching together), on a deep ink rounded square. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d1824"/>
      <stop offset="1" stop-color="#0b0a0f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.62" cy="0.42" r="0.6">
      <stop offset="0" stop-color="#ff7a59" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ff7a59" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mark" x1="0.1" y1="0.1" x2="0.9" y2="0.9">
      <stop offset="0" stop-color="#ffc06a"/>
      <stop offset="0.5" stop-color="#ff8a5c"/>
      <stop offset="1" stop-color="#f2546b"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#bg)"/>
  <rect x="16" y="16" width="480" height="480" rx="120" fill="url(#glow)"/>
  <rect x="17.5" y="17.5" width="477" height="477" rx="118.5" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="3"/>
  <circle cx="160" cy="176" r="44" fill="url(#mark)"/>
  <path d="M232 168 L232 360 L390 264 Z" fill="url(#mark)" stroke="url(#mark)" stroke-width="58" stroke-linejoin="round"/>
  <path d="M112 300 C 112 260, 140 244, 170 244 C 188 244, 200 250, 206 258 L 206 372 C 160 372, 112 352, 112 300 Z" fill="url(#mark)" opacity="0.92"/>
</svg>

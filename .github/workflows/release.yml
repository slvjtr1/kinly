# Release packages.
#   - push a tag `v<version>` (a release) or `v<version>-<label>` (a pre-release, e.g.
#     v1.1.0-beta); <version> must equal the plain numeric version in tauri.conf.json,
#     package.json and Cargo.toml (the MSI needs MAJOR.MINOR.PATCH, so a label lives
#     only in the tag and in src/lib/channel.ts), or
#   - run it by hand (Actions > Release > Run workflow); with a tag it fills a
#     release, without one the packages stay as workflow artifacts.
# Packages: Linux .deb + .AppImage (ubuntu-24.04), Windows x64 NSIS .exe + .msi.
# The release itself carries only those four installers (GitHub adds the source code
# archives and shows each asset's SHA-256 digest). The SHA256SUMS files are printed in
# the job logs and kept in the workflow artifacts. The corresponding source of the
# bundled GPL/LGPL binaries (GPL-SOURCES.txt and the source archives) goes to a
# companion pre-release in this repository, `sources-<tag>`, which the release notes
# link to, so it is offered from the same place as the binaries.
# The release is created as a draft, filled by the build jobs, then published by
# the last job: as a pre-release when the tag has a label, as the latest release
# otherwise (or left as a draft when the run asks for one). The release notes are
# the version's section of CHANGELOG.md when there is one.
# Repository secrets VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY are baked
# into the web bundle at build time. See docs/BUILDING.md.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v1.0.0-beta (empty: artifacts only)"
        required: false
        default: ""
      draft:
        description: "Keep the release as a draft"
        type: boolean
        required: false
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}-${{ inputs.tag }}
  cancel-in-progress: false

env:
  RUST_VERSION: "1.99.1"
  NODE_VERSION: "24"
  CARGO_TERM_COLOR: always

jobs:
  prepare:
    name: Version and draft release
    runs-on: ubuntu-24.04
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
        run: bash scripts/release-meta.sh
      - name: Create the draft release
        if: steps.meta.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists; assets will be replaced"
          else
            title="Kinly $VERSION"
            flags=()
            if [ "$PRERELEASE" = "true" ]; then title="Kinly ${TAG#v}"; flags+=(--prerelease); fi
            notes=$(awk -v v="$VERSION" '$0 ~ "^## " v "( |$)" { f = 1; next } /^## / && f { exit } f' CHANGELOG.md)
            if [ -z "${notes//[[:space:]]/}" ]; then notes="Kinly ${TAG#v}"; fi
            sources="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/sources-$TAG"
            printf -v notes '%s\n\n---\nSource code for the GPL/LGPL components bundled with these packages (libmpv, FFmpeg): [sources-%s](%s). GitHub shows the SHA-256 digest of each file below.' "$notes" "$TAG" "$sources"
            gh release create "$TAG" --draft "${flags[@]}" --title "$title" --notes "$notes" --target "$GITHUB_SHA"
          fi
          if gh release view "sources-$TAG" >/dev/null 2>&1; then
            echo "release sources-$TAG exists; assets will be replaced"
          else
            gh release create "sources-$TAG" --draft --prerelease --latest=false --target "$GITHUB_SHA" \
              --title "Kinly ${TAG#v}: GPL corresponding source" \
              --notes "Corresponding source for the GPL/LGPL binaries bundled with [Kinly ${TAG#v}]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/releases/tag/$TAG): libmpv-2.dll and ffmpeg.exe on Windows, libmpv and the FFmpeg libraries in the AppImage. GPL-SOURCES.txt lists what each archive contains. This is not an installer."
          fi

  linux:
    name: Linux .deb + .AppImage
    needs: prepare
    runs-on: ubuntu-24.04
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
      # linuxdeploy runs without FUSE on the runner; its strip chokes on newer ELF sections.
      APPIMAGE_EXTRACT_AND_RUN: "1"
      NO_STRIP: "true"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System packages (WebKitGTK, libmpv)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev \
            libmpv-dev build-essential pkg-config file patchelf
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Rust ${{ env.RUST_VERSION }}
        run: rustup toolchain install "$RUST_VERSION" --profile minimal && rustup default "$RUST_VERSION"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release
      - run: npm ci
      - name: Check build secrets
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] || [ -z "$VITE_SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY secrets are not set; accounts will be unavailable in this build"
          fi
      - name: Build
        run: npx tauri build --bundles deb,appimage
      - name: Collect
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        run: |
          mkdir -p out
          cp src-tauri/target/release/bundle/deb/Kinly_"$VERSION"_amd64.deb out/
          cp src-tauri/target/release/bundle/appimage/Kinly_"$VERSION"_amd64.AppImage out/
          (cd out && sha256sum Kinly_* | tee ../SHA256SUMS-linux.txt)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinly-linux-${{ needs.prepare.outputs.version }}
          path: |
            out/*
            SHA256SUMS-linux.txt
          if-no-files-found: error
      - name: Upload to the release
        if: needs.prepare.outputs.tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "$TAG" out/Kinly_* --clobber

  windows:
    name: Windows x64 NSIS + MSI
    needs: prepare
    runs-on: windows-latest
    env:
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Rust ${{ env.RUST_VERSION }}
        shell: pwsh
        run: rustup toolchain install $env:RUST_VERSION --profile minimal; rustup default $env:RUST_VERSION
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: release
      - name: libmpv + ffmpeg + yt-dlp (pinned, sha256-verified)
        shell: pwsh
        run: ./scripts/fetch-windows-deps.ps1
      - run: npm ci
      - name: Check build secrets
        shell: pwsh
        run: |
          if (-not $env:VITE_SUPABASE_URL -or -not $env:VITE_SUPABASE_PUBLISHABLE_KEY) {
            Write-Output "::warning::VITE_SUPABASE_URL / VITE_SUPABASE_PUBLISHABLE_KEY secrets are not set; accounts will be unavailable in this build"
          }
      - name: Build
        # tauri.windows.conf.json adds the NSIS/MSI targets and bundles libmpv-2.dll, ffmpeg.exe and yt-dlp.exe.
        run: npx tauri build
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Get-ChildItem out -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant(), $_.Name
          } | Set-Content SHA256SUMS-windows.txt -Encoding ascii
          Get-Content SHA256SUMS-windows.txt
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: kinly-windows-${{ needs.prepare.outputs.version }}
          path: |
            out/*
            SHA256SUMS-windows.txt
          if-no-files-found: error
      - name: Upload to the release
        if: needs.prepare.outputs.tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload $env:TAG (Get-ChildItem out -File).FullName --clobber

  sources:
    name: GPL source archives
    needs: prepare
    if: needs.prepare.outputs.tag != ''
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Fetch the corresponding source
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
        # The Windows archives match scripts/fetch-windows-deps.ps1; the Ubuntu source packages
        # match the libmpv/FFmpeg the Linux job installs and the AppImage bundles.
        run: |
          set -euo pipefail
          mkdir -p out src
          fetch() { curl -fsSL --retry 3 -o "out/$1" "$2"; echo "$1  $2" >> src/list.txt; }
          fetch source-mpv-e471496c56.tar.gz https://github.com/mpv-player/mpv/archive/e471496c56.tar.gz
          fetch source-mpv-winbuild-cmake-20261021.tar.gz https://github.com/shinchiro/mpv-winbuild-cmake/archive/refs/tags/20261021.tar.gz
          fetch source-ffmpeg-611cec792a.tar.gz https://github.com/FFmpeg/FFmpeg/archive/611cec792a.tar.gz
          fetch source-ffmpeg-builds-autobuild-2026-10-28-19-47.tar.gz https://github.com/BtbN/FFmpeg-Builds/archive/refs/tags/autobuild-2026-10-28-19-47.tar.gz
          for suite in noble noble-updates noble-security; do
            echo "deb-src http://archive.ubuntu.com/ubuntu $suite main universe"
          done | sudo tee /etc/apt/sources.list.d/kinly-src.list
          sudo apt-get update
          (cd src && apt-get source --download-only mpv ffmpeg)
          tar -C src -czf out/source-ubuntu-24.04-mpv-ffmpeg.tar.gz --exclude=list.txt .
          {
            echo "Corresponding source for the GPL components distributed with Kinly $VERSION."
            echo "See THIRD_PARTY_NOTICES.md for which package contains what."
            echo
            echo "Windows (libmpv-2.dll from shinchiro/mpv-winbuild-cmake, ffmpeg.exe from BtbN/FFmpeg-Builds):"
            sed 's/^/  /' src/list.txt
            echo
            echo "Linux AppImage (libmpv and FFmpeg libraries from Ubuntu 24.04):"
            echo "  source-ubuntu-24.04-mpv-ffmpeg.tar.gz:"
            (cd src && ls *.dsc | sed 's/^/    /')
          } > out/GPL-SOURCES.txt
          (cd out && sha256sum source-* > SHA256SUMS-sources.txt)
          cat out/GPL-SOURCES.txt out/SHA256SUMS-sources.txt
      - name: Upload to the sources release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: gh release upload "sources-$TAG" out/* --clobber

  publish:
    name: Publish the release
    needs: [prepare, linux, windows, sources]
    if: needs.prepare.outputs.tag != '' && !inputs.draft
    runs-on: ubuntu-24.04
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          # The sources release is never "Latest". It goes public first, so the link in the
          # main release's notes works from the moment that release is out.
          gh release edit "sources-$TAG" --draft=false --prerelease --latest=false
          if [ "$PRERELEASE" = "true" ]; then
            gh release edit "$TAG" --draft=false --prerelease --latest=false
          else
            gh release edit "$TAG" --draft=false --prerelease=false --latest
          fi
          gh release view "$TAG" --json url,isPrerelease,isDraft,assets --jq '{url, isPrerelease, isDraft, assets: [.assets[].name]}'
